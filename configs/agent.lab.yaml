# Konfiguracja do testu na własnym komputerze BEZ uprawnień administratora:
# kanały System i Application są czytelne dla zwykłego użytkownika.
# Uruchomienie: bin\siem-agent.exe -config configs\agent.lab.yaml run

server:
  url: https://localhost:8443/v1/ingest
  ca_file: ../certs/ca.crt
  cert_file: ../certs/agent.crt
  key_file: ../certs/agent.key

state_dir: ../data/agent
start_at: oldest

batch:
  max_events: 500
  flush_interval: 2s

channels:
  - name: System
  - name: Application
