id: pfsense
title: pfSense / OPNsense – zapora (filterlog) i logowania do panelu
description: |
  Dziennik zapory pfSense i OPNsense wysyłany przez syslog (Status → System
  Logs → Settings → Remote Logging; OPNsense: System → Settings → Logging →
  Remote). Rozpoznaje wpisy filterlog (reguły z włączonym logowaniem, IPv4
  i IPv6: akcja, interfejs, kierunek, protokół, adresy i porty) oraz
  logowania do panelu WWW (udane i nieudane). Logowania SSH rozpoznaje
  dekoder linux (sshd).
version: 1
priority: 45
dataset: pfsense.firewall
match:
  any:
    - app: [filterlog]
    - app: [php-fpm, php, audit, nginx, lighttpd]
      regex: '(Successful login|authentication error) for user '''
parser:
  type: regex
  patterns:
    - regex: '^(?P<rule>\d*),(?P<subrule>[^,]*),[^,]*,(?P<tracker>[^,]*),(?P<interface>[^,]*),(?P<reason>[^,]*),(?P<fw_action>pass|block|reject),(?P<direction>in|out),4,(?:[^,]*,){6}(?P<proto_id>\d+),(?P<proto>[^,]*),(?P<length>\d+),(?P<src_ip>[0-9.]+),(?P<dst_ip>[0-9.]+)(?:,(?P<src_port>\d+),(?P<dst_port>\d+))?'
      set: {event.action: firewall, ip_version: "4"}
    - regex: '^(?P<rule>\d*),(?P<subrule>[^,]*),[^,]*,(?P<tracker>[^,]*),(?P<interface>[^,]*),(?P<reason>[^,]*),(?P<fw_action>pass|block|reject),(?P<direction>in|out),6,(?:[^,]*,){3}(?P<proto>[^,]*),(?P<proto_id>\d+),(?P<length>\d+),(?P<src_ip>[0-9a-fA-F:]+),(?P<dst_ip>[0-9a-fA-F:]+)(?:,(?P<src_port>\d+),(?P<dst_port>\d+))?'
      set: {event.action: firewall, ip_version: "6"}
    - regex: 'Successful login for user ''(?P<user>[^'']+)'' from:? (?P<src_ip>[0-9a-fA-F.:]+)'
      set: {event.action: login, event.outcome: success, method: webgui}
    - regex: 'authentication error for user ''(?P<user>[^'']+)'' from:? (?P<src_ip>[0-9a-fA-F.:]+)'
      set: {event.action: login, event.outcome: failure, method: webgui}
fields:
  user.name: user
  source.ip: src_ip
  process.name: method
outcome:
  field: fw_action
  failure: [block, reject]
  success: [pass]
samples:
  - '<134>Oct  9 13:00:00 filterlog[4321]: 5,,,1000000103,igb0,match,block,in,4,0x0,,64,12345,0,none,6,tcp,60,203.0.113.9,192.168.1.10,44321,22,0,S,123456,,64240,,mss;sackOK;TS;nop;wscale'
  - '<134>1 2026-10-09T13:00:01+02:00 opnsense.local filterlog 4321 - [meta sequenceId="1"] 82,,,0b9e4d2f6c7e0a1b,vtnet1,match,pass,out,4,0x0,,64,54321,0,DF,17,udp,74,192.168.1.10,9.9.9.9,53022,53,54'
  - '<134>Oct  9 13:00:02 filterlog[4321]: 7,,,1000000105,igb0,match,block,in,6,0x00,0x00000,255,tcp,6,40,2001:db8::9,2001:db8:1::10,44321,443,0,S,1,,64800,,'
  - '<38>Oct  9 13:00:03 pfsense.home php-fpm[345]: /index.php: webConfigurator authentication error for user ''admin'' from: 203.0.113.9'
  - '<38>Oct  9 13:00:04 pfsense.home php-fpm[345]: /index.php: Successful login for user ''admin'' from: 192.168.1.5 (Local Database)'
