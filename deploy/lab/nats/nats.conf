# NATS JetStream dla laboratorium SIEM.
server_name: siem-nats
listen: 0.0.0.0:4222
http: 0.0.0.0:8222

# Paczki agentów (skompresowane) do 8 MB – zgodnie z limitem endpointu.
max_payload: 8MB

jetstream {
  store_dir: /data
  max_memory_store: 256MB
  # Kolejki trzymają tylko nieprzetworzone wiadomości (retencja Interest);
  # suma SIEM_QUEUE_*_MAX_MB musi zmieścić się w tym limicie.
  max_file_store: 20GB
}
