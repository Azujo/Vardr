# NATS JetStream dla laboratorium SIEM.
server_name: siem-nats
listen: 0.0.0.0:4222
http: 0.0.0.0:8222

# Paczki agentów (skompresowane) do 8 MB – zgodnie z limitem endpointu.
max_payload: 8MB

jetstream {
  store_dir: /data
  max_memory_store: 256MB
  # Retencja strumieni 48 h; limit chroni dysk VM przy awarii odbiorców.
  max_file_store: 20GB
}
