# NATS JetStream dla laboratorium SIEM.
server_name: siem-nats
listen: 0.0.0.0:4222
http: 0.0.0.0:8222

# Paczki agentów (skompresowane) do 8 MB – zgodnie z limitem endpointu.
max_payload: 8MB

jetstream {
  store_dir: /data
  max_memory_store: 256MB
  # Kolejki trzymają tylko nieprzetworzone wiadomości (retencja Interest).
  # Limit = rezerwacje kolejek (SIEM_QUEUE_*_MAX_MB, w tym kopie dla
  # odtwarzania z archiwum: 8 + 8 + 2 + 2 GB) plus zapas 1 GB na małe
  # magazyny (heartbeaty, unieważnienia, dekodery) – gdy rezerwacje zajmą
  # cały limit, JetStream odmówi utworzenia każdego nowego magazynu.
  max_file_store: 21GB
}
