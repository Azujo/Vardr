# Stos laboratoryjny SIEM (etap 1 roadmapy):
#   agent → siem-ingest (mTLS :8443) → NATS SIEM_RAW → siem-normalizer
#         → NATS SIEM_EVENTS → siem-writer → ClickHouse → Grafana (:3000)
#   metryki: usługi :9100 (sieć Dockera) → Prometheus → Grafana „Zdrowie potoku”
#   panel: przeglądarka → siem-api (HTTPS :8444) → Saga (PostgreSQL)
#
# Hasła w pliku .env (wzór: .env.example). Binaria serwera w ./bin
# (budowane na stacji: GOOS=linux, patrz README).

name: siem

x-server: &server
  restart: unless-stopped
  user: "1000:1000"          # właściciel plików certyfikatów na VM
  environment: &server-env
    SIEM_NATS_URL: nats://nats:4222
    # Pojemność kolejek (MB). Po zapełnieniu ingest odpowiada 503, a dane
    # czekają u agentów – nic nie jest usuwane po cichu (roadmapa, zał. E).
    SIEM_QUEUE_RAW_MAX_MB: ${SIEM_QUEUE_RAW_MAX_MB:-8192}
    SIEM_QUEUE_EVENTS_MAX_MB: ${SIEM_QUEUE_EVENTS_MAX_MB:-8192}
  depends_on:
    nats:
      condition: service_healthy
  logging: &logging
    driver: json-file
    options: { max-size: "20m", max-file: "3" }

services:
  nats:
    image: nats:2.12-alpine
    restart: unless-stopped
    command: ["-c", "/etc/nats/nats.conf"]
    volumes:
      - ./nats/nats.conf:/etc/nats/nats.conf:ro
      - nats-data:/data
    ports:
      - "127.0.0.1:8222:8222"   # monitoring tylko lokalnie
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz?js-enabled-only=true"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m
    logging: *logging

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_ADMIN_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_ADMIN_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      SIEM_WRITER_PASSWORD: ${CLICKHOUSE_WRITER_PASSWORD}
      SIEM_GRAFANA_PASSWORD: ${CLICKHOUSE_GRAFANA_PASSWORD}
      SIEM_PANEL_PASSWORD: ${CLICKHOUSE_PANEL_PASSWORD}
      SIEM_EVENTS_TTL_DAYS: ${SIEM_EVENTS_TTL_DAYS:-5}
      SIEM_RAW_TTL_DAYS: ${SIEM_RAW_TTL_DAYS:-5}
    volumes:
      - ./clickhouse/init:/docker-entrypoint-initdb.d:ro
      - ./clickhouse/config.d/siem.xml:/etc/clickhouse-server/config.d/siem.xml:ro
      - clickhouse-data:/var/lib/clickhouse
    ports:
      - "127.0.0.1:8123:8123"   # HTTP tylko lokalnie (diagnostyka)
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 4g
    logging: *logging

  ingest:
    <<: *server
    build: { context: ., args: { BIN: siem-ingest } }
    image: siem/ingest:lab
    volumes:
      - ./certs:/certs:ro
    environment:
      <<: *server-env
      SIEM_INGEST_MAX_INFLIGHT: ${SIEM_INGEST_MAX_INFLIGHT:-64}
      SIEM_INGEST_QUEUE_HIGH_WATER: ${SIEM_INGEST_QUEUE_HIGH_WATER:-0.9}
    ports:
      - "8443:8443"
    mem_limit: 256m

  normalizer:
    <<: *server
    build: { context: ., args: { BIN: siem-normalizer } }
    image: siem/normalizer:lab
    environment:
      <<: *server-env
      # Rzadsze odśmiecanie pamięci w granicy limitu kontenera (mniej CPU na GC).
      GOGC: "200"
      GOMEMLIMIT: 400MiB
    mem_limit: 512m

  writer:
    <<: *server
    build: { context: ., args: { BIN: siem-writer } }
    image: siem/writer:lab
    environment:
      <<: *server-env
      SIEM_CLICKHOUSE_ADDR: clickhouse:9000
      SIEM_CLICKHOUSE_USER: siem_writer
      SIEM_CLICKHOUSE_PASSWORD: ${CLICKHOUSE_WRITER_PASSWORD}
      GOGC: "200"
      GOMEMLIMIT: 400MiB
    depends_on:
      nats: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
    mem_limit: 512m

  # Urd – archiwum NIS2: oryginalne paczki agentów, godzinowe manifesty
  # z łańcuchem hashy (spis w Sadze, schemat urd), okresowa weryfikacja.
  # Katalog ./archive musi należeć do użytkownika 1000 (mkdir na VM).
  archiver:
    <<: *server
    build: { context: ., args: { BIN: siem-archiver } }
    image: siem/archiver:lab
    volumes:
      # Archiwum na osobnym dysku (SIEM_ARCHIVE_PATH w .env, np. /srv/heimdall/archive):
      # zapełnienie archiwum nie zatrzyma wtedy kolejki ani bazy zdarzeń.
      - ${SIEM_ARCHIVE_PATH:-./archive}:/archive
    environment:
      <<: *server-env
      SIEM_ARCHIVE_DB_URL: postgres://siem_archiver:${SAGA_ARCHIVER_PASSWORD}@saga:5432/saga?sslmode=disable
      SIEM_ARCHIVE_RETENTION_DAYS: ${SIEM_ARCHIVE_RETENTION_DAYS:-30}
      # Agenci wyłączeni z archiwum (prefiksy): generator ruchu nie zapełnia dysku.
      SIEM_ARCHIVE_EXCLUDE_AGENTS: ${SIEM_ARCHIVE_EXCLUDE_AGENTS-agt-load-}
      GOMEMLIMIT: 300MiB
    depends_on:
      nats: { condition: service_healthy }
      saga: { condition: service_healthy }
    mem_limit: 384m

  # Saga – baza panelu (konta, sesje, audyt; później agenci, tokeny, reguły).
  saga:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: saga
      # saga_admin tylko do administracji; usługi mają osobne role bez
      # superużytkownika (saga/init/10-roles.sh).
      POSTGRES_USER: saga_admin
      POSTGRES_PASSWORD: ${SAGA_ADMIN_PASSWORD}
      SAGA_DB_PASSWORD: ${SAGA_DB_PASSWORD}
      SAGA_ARCHIVER_PASSWORD: ${SAGA_ARCHIVER_PASSWORD}
    volumes:
      - ./saga/init:/docker-entrypoint-initdb.d:ro
      - saga-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "saga_admin", "-d", "saga"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m
    logging: *logging

  # Hliðskjálf – panel (siem-api + aplikacja React) pod HTTPS :8444.
  api:
    restart: unless-stopped
    user: "1000:1000"
    build: { context: ., args: { BIN: siem-api } }
    image: siem/api:lab
    environment:
      SIEM_API_DB_URL: postgres://siem_api:${SAGA_DB_PASSWORD}@saga:5432/saga?sslmode=disable
      SIEM_NATS_URL: nats://nats:4222
      # Bifröst: adres serwera wpisywany do paczek instalacyjnych agentów.
      SIEM_PUBLIC_SERVER: ${SIEM_PUBLIC_SERVER:-}
      # Mímir: wyszukiwarka zdarzeń (konto ClickHouse tylko do odczytu).
      SIEM_CLICKHOUSE_ADDR: clickhouse:9000
      SIEM_CLICKHOUSE_USER: siem_panel
      SIEM_CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PANEL_PASSWORD}
    volumes:
      - ./certs:/certs:ro
      - ./agent-dist:/agent-dist:ro   # siem_agent.exe do paczek instalacyjnych
    ports:
      - "8444:8444"
    depends_on:
      saga: { condition: service_healthy }
      nats: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
    mem_limit: 256m
    logging: *logging

  # Metryki systemu VM (miejsce na dyskach, CPU, pamięć) dla Prometheusa.
  node-exporter:
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    command: ["--path.rootfs=/host", "--collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|snap|var/lib/docker/.+)($$|/)"]
    pid: host
    volumes:
      - /:/host:ro,rslave
    mem_limit: 64m
    logging: *logging

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=2GB
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"   # interfejs tylko lokalnie (tunel SSH)
    mem_limit: 512m
    logging: *logging

  grafana:
    image: grafana/grafana:12.2.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_PLUGINS_PREINSTALL_SYNC: grafana-clickhouse-datasource
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      CLICKHOUSE_GRAFANA_PASSWORD: ${CLICKHOUSE_GRAFANA_PASSWORD}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      clickhouse: { condition: service_healthy }
      prometheus: { condition: service_started }
    mem_limit: 512m
    logging: *logging

volumes:
  nats-data:
  prometheus-data:
  saga-data:
  clickhouse-data:
  grafana-data:
