title: Cisco ASA – skanowanie portów z jednego adresu
id: 9ee4af27-d592-4957-8474-3aee59ea72c9
status: experimental
description: |
  Listy dostępu ASA odrzuciły połączenia z jednego adresu na co najmniej
  20 różnych portów w ciągu 2 minut. Z internetu to rozpoznanie przed
  atakiem, z sieci wewnętrznej – skanowanie przez przejęty komputer.
  Wymaga komunikatów 106023 (domyślnie włączone) albo 106100 (log przy
  wpisie listy dostępu).
author: Vardr
tags:
  - attack.reconnaissance
  - attack.t1595.001
  - attack.discovery
  - attack.t1046
logsource:
  product: cisco
detection:
  selection:
    event.action: firewall
    event.outcome: failure
  condition: selection
falsepositives:
  - Autoryzowany skaner podatności (dodaj jego adres jako wyjątek)
  - Masowe skanery internetu (Shodan, Censys)
level: medium
vardr:
  i18n:
    en:
      title: "Cisco ASA – port scan from one address"
      description: |
        ASA access lists denied connections from one address to at least 20 different
        ports within 2 minutes. From the internet this is reconnaissance before an attack,
        from the internal network – scanning by a compromised computer. Requires messages
        106023 (enabled by default) or 106100 (log on the access list entry).
      instructions: |
        Address {{source.ip}} tried to connect to {{count}} different ports in {{window}}
        (ports: {{values}}). Internal address – check this computer. Address from the
        internet – check whether any connection to exposed services was permitted.
  group_by: [source.ip]
  threshold:
    count: 20
    window: 2m
    distinct: dst_port
  suppress: 1h
  instructions: |
    Adres {{source.ip}} próbował połączyć się na {{count}} różnych portów
    w {{window}} (porty: {{values}}). Adres wewnętrzny – sprawdź ten komputer.
    Adres z internetu – sprawdź, czy któreś połączenie na wystawione usługi
    zostało przepuszczone.
