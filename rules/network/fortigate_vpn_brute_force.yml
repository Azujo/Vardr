title: FortiGate – seria nieudanych logowań do VPN
id: fe9a7cec-b4c5-4314-b533-580e364ba472
status: stable
description: |
  Co najmniej 10 nieudanych logowań do SSL VPN FortiGate z jednego adresu
  w ciągu 5 minut, na dowolne konta. Zgadywanie haseł (brute force) albo
  sprawdzanie wykradzionych par login–hasło (credential stuffing) – portal
  VPN jest jednym z najczęściej atakowanych celów z internetu.
author: Vardr
tags:
  - attack.credential_access
  - attack.t1110
  - attack.initial_access
  - attack.t1133
logsource:
  product: fortigate
detection:
  selection:
    event.action: ssl-login-fail
  condition: selection
falsepositives:
  - Użytkownik z wygasłym hasłem, którego klient FortiClient ponawia połączenie
  - Kilku użytkowników za jednym adresem NAT (np. biuro partnera) z błędnymi hasłami
level: high
vardr:
  i18n:
    en:
      title: "FortiGate – series of failed VPN logins"
      description: |
        At least 10 failed FortiGate SSL VPN logins from one address within
        5 minutes, to any accounts. Password guessing (brute force) or testing stolen
        login–password pairs (credential stuffing) – the VPN portal is one of the most
        frequently attacked targets on the internet.
      instructions: |
        {{count}} failed SSL VPN logins from address {{source.ip}} in {{window}}
        (last account {{user.name}} on {{host.name}}). Check in the alert events how many
        different accounts were tried – many accounts means credential stuffing, one
        account means password guessing. Block the address (address list in a local-in
        policy or a blocked group), check whether there was a successful login from this
        address (action=tunnel-up or ssl-login) and whether the VPN portal requires MFA.
        After a successful login – disable the account and change the password.
  group_by: [source.ip]
  threshold:
    count: 10
    window: 5m
  suppress: 1h
  instructions: |
    {{count}} nieudanych logowań do SSL VPN z adresu {{source.ip}} w {{window}}
    (ostatnio konto {{user.name}} na {{host.name}}). Sprawdź w zdarzeniach
    alertu, ile różnych kont próbowano – wiele kont to credential stuffing,
    jedno konto to zgadywanie hasła. Zablokuj adres (lista adresów w polityce
    local-in albo grupa zablokowanych), sprawdź, czy z tego adresu nie było
    udanego logowania (action=tunnel-up albo ssl-login) i czy portal VPN
    wymaga MFA. Po skutecznym logowaniu – wyłącz konto i zmień hasło.
