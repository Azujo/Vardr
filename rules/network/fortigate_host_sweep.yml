title: FortiGate – przeszukiwanie sieci (jeden adres łączy się z wieloma hostami)
id: 9c55e2e1-ad24-400b-9d3d-bb7159593ab4
status: experimental
description: |
  Połączenia z jednego adresu do co najmniej 30 różnych adresów docelowych
  w ciągu 2 minut, odrzucone przez zaporę. Tak wygląda szukanie aktywnych
  komputerów w sieci (ping sweep, skanowanie podsieci) – przez napastnika
  z zewnątrz albo z przejętego komputera wewnątrz.
author: Vardr
tags:
  - attack.reconnaissance
  - attack.t1595.001
  - attack.discovery
  - attack.t1018
logsource:
  product: fortigate
detection:
  selection:
    type: traffic
    event.action: deny
  condition: selection
falsepositives:
  - Systemy monitorowania i inwentaryzacji sieci
level: medium
vardr:
  i18n:
    en:
      title: "FortiGate – network sweep (one address connects to many hosts)"
      description: |
        Connections from one address to at least 30 different destination addresses
        within 2 minutes, denied by the firewall. This is what searching for live
        computers on the network looks like (ping sweep, subnet scan) – by an attacker
        from outside or from a compromised computer inside.
      instructions: |
        Address {{source.ip}} tried to connect to {{count}} different addresses
        in {{window}}. If it is an internal computer and not a monitoring system
        – isolate it and check what started it. An address from the internet –
        block it on the firewall.
  group_by: [source.ip]
  threshold:
    count: 30
    window: 2m
    distinct: dstip
  suppress: 1h
  instructions: |
    Adres {{source.ip}} próbował łączyć się z {{count}} różnymi adresami
    w {{window}}. Jeśli to komputer wewnętrzny, a nie system monitorowania
    – odizoluj go i sprawdź, co go uruchomiło. Adres z internetu –
    zablokuj go na zaporze.
