title: MikroTik – seria nieudanych logowań do routera
id: cb8df317-c73f-45ef-ae1f-22758105458c
status: stable
description: |
  Co najmniej 5 nieudanych logowań do RouterOS (Winbox, SSH, WebFig, API,
  Telnet) z jednego adresu w ciągu 5 minut. Typowe dla zgadywania hasła
  administratora, zwłaszcza gdy usługi zarządzania są dostępne z internetu.
author: Vardr
tags:
  - attack.credential_access
  - attack.t1110.001
logsource:
  product: mikrotik
detection:
  selection:
    event.action: login
    event.outcome: failure
  condition: selection
falsepositives:
  - Administrator, który pomylił hasło albo ma zapamiętane stare w Winboxie
  - Skrypt albo system monitoringu ze starym hasłem (stały adres, równe odstępy)
level: medium
vardr:
  i18n:
    en:
      title: "MikroTik – series of failed router logins"
      description: |
        At least 5 failed RouterOS logins (Winbox, SSH, WebFig, API, Telnet) from
        one address within 5 minutes. Typical of administrator password guessing,
        especially when management services are reachable from the internet.
      instructions: |
        {{count}} failed logins to router {{host.name}} from address {{source.ip}}
        in {{window}} (last account {{user.name}} via {{process.name}}). Address from
        the internet – restrict access to management services (/ip service: address,
        firewall rule on the input chain) and disable unused ones (telnet, ftp, www,
        api). Address from the local network – find out whose computer it is. Check
        whether a successful login from this address followed the series ("logged in from").
  group_by: [host.name, source.ip]
  threshold:
    count: 5
    window: 5m
  suppress: 1h
  instructions: |
    {{count}} nieudanych logowań do routera {{host.name}} z adresu {{source.ip}}
    w {{window}} (ostatnio konto {{user.name}} przez {{process.name}}). Adres
    z internetu – ogranicz dostęp do usług zarządzania (/ip service: address,
    reguła zapory na łańcuchu input) i wyłącz nieużywane (telnet, ftp, www,
    api). Adres z sieci lokalnej – ustal, czyj to komputer. Sprawdź, czy po
    serii nie było udanego logowania z tego adresu („logged in from”).
