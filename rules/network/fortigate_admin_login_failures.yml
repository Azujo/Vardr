title: FortiGate – seria nieudanych logowań administratora
id: 2e43f8f5-104d-4f1f-8523-bf57f16a3d1b
status: stable
description: |
  Co najmniej 5 nieudanych logowań do panelu administracyjnego FortiGate
  (HTTPS, SSH, konsola) z jednego adresu w ciągu 5 minut.
author: Vardr
tags:
  - attack.credential_access
  - attack.t1110.001
logsource:
  product: fortigate
detection:
  selection:
    event.action: login
    event.outcome: failure
  condition: selection
falsepositives:
  - Administrator, który pomylił hasło
level: high
vardr:
  i18n:
    en:
      title: "FortiGate – series of failed administrator logins"
      description: |
        At least 5 failed logins to the FortiGate administrative interface
        (HTTPS, SSH, console) from one address within 5 minutes.
      instructions: |
        {{count}} failed administrator logins to {{host.name}} from address
        {{source.ip}} in {{window}} (last account {{user.name}}). The administrative
        interface should not be reachable from the internet – restrict it to trusted
        addresses (administrator trusthosts, no HTTPS/SSH on the WAN interface). Check
        whether a successful login from this address followed the series.
  group_by: [host.name, source.ip]
  threshold:
    count: 5
    window: 5m
  suppress: 1h
  instructions: |
    {{count}} nieudanych logowań administratora do {{host.name}} z adresu
    {{source.ip}} w {{window}} (ostatnio konto {{user.name}}). Panel
    administracyjny nie powinien być dostępny z internetu – ogranicz go
    do zaufanych adresów (trusthost administratorów, interfejs bez HTTPS/SSH
    na WAN). Sprawdź, czy po serii nie było udanego logowania z tego adresu.
