title: Wyczyszczenie dziennika zabezpieczeń
id: 557f7b4d-d6bf-4d17-8aaf-cd1094a46a67
status: stable
description: |
  Dziennik Security został wyczyszczony. Napastnicy czyszczą dziennik, żeby
  zatrzeć ślady; w normalnej pracy prawie się to nie zdarza. Zdarzenia sprzed
  wyczyszczenia są w Vardrze (i w archiwum Urd), o ile agent zdążył je wysłać.
author: Vardr
tags:
  - attack.defense_impairment
  - attack.t1685.005
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 1102
  condition: selection
falsepositives:
  - Rzadkie, planowane czyszczenie dziennika przez administratora
level: high
vardr:
  instructions: |
    Dziennik wyczyścił {{SubjectDomainName}}\{{SubjectUserName}} na komputerze
    {{Computer}}. Ustal, czy czyszczenie było planowane, i przejrzyj w Mímirze
    zdarzenia z tego komputera z okresu przed wyczyszczeniem.
