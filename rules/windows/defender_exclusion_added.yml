title: Dodano wykluczenie w Microsoft Defender
id: 3e35fe1a-3373-4e25-9943-e757afe9f78b
status: experimental
description: |
  Zmiana ustawień Defendera (5007) dodająca wykluczenie – ścieżki,
  rozszerzenia, procesu albo adresu. Wykluczony katalog nie jest skanowany,
  więc napastnik może w nim bezpiecznie trzymać swoje narzędzia.
author: Vardr
tags:
  - attack.defense_impairment
  - attack.t1685
logsource:
  product: windows
  service: windefend
detection:
  selection:
    EventID: 5007
    New Value|contains: '\Exclusions\'
  condition: selection
falsepositives:
  - Wykluczenia wymagane przez oprogramowanie (bazy danych, kopie zapasowe) dodawane przez administratora
level: high
vardr:
  i18n:
    en:
      title: "Exclusion added in Microsoft Defender"
      description: |
        A Defender settings change (5007) adding an exclusion – of a path,
        extension, process or address. An excluded folder is not scanned, so an attacker
        can safely keep their tools there.
      instructions: |
        A Defender exclusion was added on {{host.name}}: {{New Value}}. Find out whether
        it is an agreed change (software documentation, a request). If not – remove the
        exclusion, scan the excluded location and check who was signed in to the
        computer at that time.
  group_by: [host.name]
  suppress: 1h
  instructions: |
    Na {{host.name}} dodano wykluczenie Defendera: {{New Value}}. Ustal, czy
    to uzgodniona zmiana (dokumentacja oprogramowania, zgłoszenie). Jeśli
    nie – usuń wykluczenie, przeskanuj wykluczoną lokalizację i sprawdź, kto
    był zalogowany na komputerze w tym czasie.
