title: Utworzono konto użytkownika
id: 9f379649-a04b-43de-b3a0-25587cf713de
status: stable
description: |
  Utworzono nowe konto (domenowe albo lokalne). Samo w sobie zwykłe, ale konta
  zakładane poza procesem kadrowym albo na serwerach są typowym sposobem
  utrwalenia dostępu.
author: Vardr
tags:
  - attack.persistence
  - attack.t1136
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4720
  condition: selection
falsepositives:
  - Zakładanie kont przez dział IT
level: low
vardr:
  i18n:
    en:
      title: "User account created"
      description: |
        A new account (domain or local) was created. Ordinary in itself, but accounts
        created outside the HR process or on servers are a typical way to persist access.
      instructions: |
        Account {{TargetUserName}} (domain {{TargetDomainName}}) was created by
        {{SubjectDomainName}}\{{SubjectUserName}}. Check whether there was a request.
  instructions: |
    Konto {{TargetUserName}} (domena {{TargetDomainName}}) założył
    {{SubjectDomainName}}\{{SubjectUserName}}. Sprawdź, czy było zgłoszenie.
