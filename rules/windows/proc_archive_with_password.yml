title: Pakowanie danych do archiwum z hasłem (7-Zip, RAR)
id: e7792889-bce8-4541-b87c-df1cd6e7eff3
status: experimental
description: |
  7-Zip albo RAR tworzy archiwum z hasłem (-p, -hp) albo z ukrytymi nazwami
  plików (-mhe). Przed wyniesieniem danych napastnicy pakują je do
  zaszyfrowanych archiwów, żeby zawartość nie była widoczna dla filtrów.
author: Vardr
tags:
  - attack.collection
  - attack.t1560.001
logsource:
  product: windows
  category: process_creation
detection:
  archiver:
    Image|endswith:
      - '\7z.exe'
      - '\7za.exe'
      - '\7zr.exe'
      - '\rar.exe'
      - '\winrar.exe'
  add:
    CommandLine|contains: ' a '
  password:
    CommandLine|re: '(?i)\s-(h?p\S|mhe)'
  condition: archiver and add and password
falsepositives:
  - Użytkownicy szyfrujący archiwa do wysyłki (np. dane osobowe zgodnie z procedurą)
  - Skrypty kopii zapasowych z hasłem
level: medium
vardr:
  i18n:
    en:
      title: "Packing data into a password-protected archive (7-Zip, RAR)"
      description: |
        7-Zip or RAR creates an archive with a password (-p, -hp) or with hidden file
        names (-mhe). Before exfiltrating data, attackers pack it into encrypted archives
        so that the content is not visible to filters.
      instructions: |
        A password-protected archive was created on {{host.name}}: {{CommandLine}}. Check
        which folders were packed and where the archive went afterwards (network
        connections, copying to a share, cloud). The password in the command may allow
        reading the archive if the file still exists.
  group_by: [host.name]
  suppress: 1h
  instructions: |
    Na {{host.name}} utworzono archiwum z hasłem: {{CommandLine}}. Sprawdź,
    jakie katalogi spakowano i dokąd archiwum potem trafiło (połączenia
    sieciowe, kopiowanie na udział, chmura). Hasło w poleceniu może pozwolić
    odczytać archiwum, jeśli plik jeszcze istnieje.
