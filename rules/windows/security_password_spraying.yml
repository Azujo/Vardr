title: Password spraying – wiele kont z jednego adresu
id: 069fc75e-f818-4044-a674-eb48dda23f1c
status: stable
description: |
  Nieudane logowania (4625) albo błędne hasła Kerberos (4771) na co najmniej
  5 różnych kont z jednego adresu IP w ciągu 10 minut. Atakujący próbuje
  jednego popularnego hasła na wielu kontach, żeby nie blokować żadnego z nich.
  Liczone są różne konta, więc ta sama próba widoczna w dwóch dziennikach
  (komputer i kontroler domeny) nie zawyża wyniku.
author: Vardr
tags:
  - attack.credential_access
  - attack.t1110.003
logsource:
  product: windows
  service: security
detection:
  logon:
    EventID: 4625
  kerberos:
    EventID: 4771
    Status: '0x18'
  computer_account:
    TargetUserName|endswith: '$'
  local:
    IpAddress:
      - ''
      - '-'
      - '127.0.0.1'
      - '::1'
  condition: (logon or kerberos) and not computer_account and not local
falsepositives:
  - Serwer pośredniczący (np. bramka RDP, serwer pocztowy), przez który loguje się wielu użytkowników
  - Skaner podatności z listą kont
level: high
vardr:
  i18n:
    en:
      title: "Password spraying – many accounts from one address"
      description: |
        Failed logons (4625) or wrong Kerberos passwords (4771) for at least
        5 different accounts from one IP address within 10 minutes. The attacker tries
        one popular password on many accounts so as not to lock any of them.
        Distinct accounts are counted, so the same attempt visible in two logs
        (computer and domain controller) does not inflate the result.
      instructions: |
        From address {{IpAddress}} in {{window}} there were failed logons to {{count}}
        different accounts: {{values}}. Find out whose address it is (DHCP, VPN). If it is
        not a known proxy server – cut the address off, check whether any of these
        accounts later signed in successfully (4624) and force a password change for
        accounts where the attempt succeeded.
  group_by: [source.ip]
  threshold:
    count: 5
    window: 10m
    distinct: TargetUserName
  suppress: 1h
  instructions: |
    Z adresu {{IpAddress}} w {{window}} były nieudane logowania na {{count}}
    różnych kont: {{values}}. Ustal, czyj to adres (DHCP, VPN). Jeśli to nie
    jest znany serwer pośredniczący – odetnij adres, sprawdź, czy któreś
    z tych kont zalogowało się potem poprawnie (4624) i wymuś zmianę haseł
    kont, na których próba się udała.
