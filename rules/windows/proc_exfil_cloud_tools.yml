title: Wysyłanie danych narzędziem do chmury (rclone, MEGA, curl --upload-file)
id: dccb69cd-3a68-4712-aee5-9087e23f9de8
status: experimental
description: |
  rclone z poleceniem copy, sync albo move, klient MEGA (mega-put,
  MEGAcmd) albo curl wysyłający plik (--upload-file, -T, -F z @). Grupy
  ransomware przed zaszyfrowaniem wynoszą tak dane do chmury, żeby
  szantażować ich ujawnieniem.
author: Vardr
tags:
  - attack.exfiltration
  - attack.t1567.002
  - attack.t1048
logsource:
  product: windows
  category: process_creation
detection:
  rclone_img:
    Image|endswith: '\rclone.exe'
  rclone_cmd:
    CommandLine|contains:
      - ' copy '
      - ' sync '
      - ' move '
      - ' copyto '
  mega:
    Image|endswith:
      - '\mega-put.exe'
      - '\megacmdserver.exe'
  curl:
    Image|endswith: '\curl.exe'
    CommandLine|contains:
      - '--upload-file'
      - ' -T '
      - '=@'
  condition: (rclone_img and rclone_cmd) or mega or curl
falsepositives:
  - Kopie zapasowe do chmury robione przez rclone na serwerze (wyklucz konto usługi)
level: high
vardr:
  i18n:
    en:
      title: "Sending data with a cloud tool (rclone, MEGA, curl --upload-file)"
      description: |
        rclone with copy, sync or move, the MEGA client (mega-put,
        MEGAcmd) or curl uploading a file (--upload-file, -T, -F with @). Ransomware
        groups exfiltrate data to the cloud this way before encryption, to blackmail
        victims with its disclosure.
      instructions: |
        Data upload was started on {{host.name}}: {{CommandLine}}. Find out the
        destination (cloud account, address) and the amount of data – the firewall will
        show outbound traffic from this computer. If it is not a known backup: cut the
        computer off from the internet, preserve the rclone configuration (it contains
        credentials to the attacker's account) and start the data breach incident procedure.
  group_by: [host.name]
  suppress: 1h
  instructions: |
    Na {{host.name}} uruchomiono wysyłanie danych: {{CommandLine}}. Ustal
    cel (konto chmury, adres) i ilość danych – zapora pokaże ruch wychodzący
    z tego komputera. Jeśli to nie znana kopia zapasowa: odetnij komputer
    od internetu, zachowaj konfigurację rclone (zawiera dane dostępu do
    konta napastnika) i uruchom procedurę incydentu z wyciekiem danych.
