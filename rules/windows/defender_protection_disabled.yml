title: Wyłączono ochronę Microsoft Defender
id: 558a2a89-3f7e-40b9-8ea1-9a6e36e65a55
status: experimental
description: |
  Wyłączona ochrona w czasie rzeczywistym (5001), skanowanie antywirusowe
  albo antyszpiegowskie (5010, 5012), albo ochrona przed naruszeniem
  zablokowała próbę zmiany ustawień (5013). Napastnicy wyłączają
  antywirusa przed uruchomieniem właściwego narzędzia (np. ransomware).
author: Vardr
tags:
  - attack.defense_impairment
  - attack.t1685
logsource:
  product: windows
  service: windefend
detection:
  selection:
    EventID:
      - 5001
      - 5010
      - 5012
      - 5013
  condition: selection
falsepositives:
  - Administrator diagnozujący problem z wydajnością (powinien to zgłosić)
  - Instalacja innego antywirusa (Defender przechodzi wtedy w tryb pasywny)
level: high
vardr:
  i18n:
    en:
      title: "Microsoft Defender protection disabled"
      description: |
        Real-time protection disabled (5001), antivirus or antispyware scanning
        disabled (5010, 5012), or tamper protection blocked an attempt to change
        settings (5013). Attackers disable the antivirus before running the actual
        tool (e.g. ransomware).
      instructions: |
        Defender protection was disabled, or someone tried to disable it, on {{host.name}}
        (event {{EventID}}). Find out who did it and why. Without an agreement – turn
        protection back on, review the processes started on the computer in the last
        hour and treat the computer as suspicious. Event 5013 means tamper protection
        stopped the change – someone (or something) tried to weaken Defender.
  group_by: [host.name]
  suppress: 1h
  instructions: |
    Na {{host.name}} wyłączono ochronę Defendera albo próbowano ją wyłączyć
    (zdarzenie {{EventID}}). Ustal, kto to zrobił i dlaczego. Bez
    uzgodnienia – włącz ochronę z powrotem, przejrzyj procesy uruchomione na
    komputerze w ostatniej godzinie i traktuj komputer jako podejrzany.
    Zdarzenie 5013 oznacza, że ochrona przed naruszeniem zatrzymała zmianę –
    ktoś (albo coś) próbował osłabić Defendera.
