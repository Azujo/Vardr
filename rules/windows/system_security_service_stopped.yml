title: Zatrzymano albo przerwano usługę Sysmon
id: d6db3a52-6c0f-477f-b079-66457370158a
status: stable
description: |
  Usługa Sysmon została zatrzymana (7036) albo nieoczekiwanie przerwała
  działanie (7031, 7034). Tekst stanu w 7036 zależy od języka Windows –
  reguła zna angielski i polski. Zatrzymanie samego agenta Vardra zgłasza
  reguła wbudowana „Próba sabotażu agenta” (agent odróżnia zatrzymanie
  tokenem z panelu od zatrzymania bez tokenu i zabicia procesu).
author: Vardr
tags:
  - attack.defense_impairment
  - attack.t1685
  - attack.impact
  - attack.t1489
logsource:
  product: windows
  service: system
detection:
  service:
    param1:
      - 'Sysmon'
      - 'Sysmon64'
  stopped:
    EventID: 7036
    param2:
      - 'stopped'
      - 'zatrzymany'
      - 'zatrzymana'
      - 'zatrzymane'
  crashed:
    EventID:
      - 7031
      - 7034
  condition: service and (stopped or crashed)
falsepositives:
  - Aktualizacja Sysmona
  - Planowane prace administracyjne
level: medium
vardr:
  i18n:
    en:
      title: "Sysmon service stopped or terminated"
      description: |
        The Sysmon service was stopped (7036) or terminated unexpectedly
        (7031, 7034). The state text in 7036 depends on the Windows language –
        the rule knows English and Polish. Stopping the Vardr agent itself is reported
        by the built-in rule "Agent tampering attempt" (the agent distinguishes a stop
        with a panel token from a stop without a token and from killing the process).
      instructions: |
        Service {{param1}} on {{Computer}} stopped working. Check whether there was an
        update or announced work; if not – find out who was signed in at that time
        (4624 in Mímir) and review the events from the period when the service was not
        running (without Sysmon there is no data about processes and connections).
  group_by: [Computer, param1]
  suppress: 1h
  instructions: |
    Usługa {{param1}} na {{Computer}} przestała działać. Sprawdź, czy była
    aktualizacja albo zgłoszone prace; jeśli nie – ustal, kto był zalogowany
    w tym czasie (4624 w Mímirze), i przejrzyj zdarzenia z okresu, gdy usługa
    nie działała (bez Sysmona brakuje danych o procesach i połączeniach).
