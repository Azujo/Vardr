title: Zatrzymano albo przerwano usługę Sysmon
id: d6db3a52-6c0f-477f-b079-66457370158a
status: stable
description: |
  Usługa Sysmon została zatrzymana (7036) albo nieoczekiwanie przerwała
  działanie (7031, 7034). Tekst stanu w 7036 zależy od języka Windows –
  reguła zna angielski i polski. Zatrzymanie samego agenta Heimdalla zgłasza
  reguła wbudowana „Próba sabotażu agenta” (agent odróżnia zatrzymanie
  tokenem z panelu od zatrzymania bez tokenu i zabicia procesu).
author: Heimdall
tags:
  - attack.defense_impairment
  - attack.t1685
  - attack.impact
  - attack.t1489
logsource:
  product: windows
  service: system
detection:
  service:
    param1:
      - 'Sysmon'
      - 'Sysmon64'
  stopped:
    EventID: 7036
    param2:
      - 'stopped'
      - 'zatrzymany'
      - 'zatrzymana'
      - 'zatrzymane'
  crashed:
    EventID:
      - 7031
      - 7034
  condition: service and (stopped or crashed)
falsepositives:
  - Aktualizacja Sysmona
  - Planowane prace administracyjne
level: medium
heimdall:
  group_by: [Computer, param1]
  suppress: 1h
  instructions: |
    Usługa {{param1}} na {{Computer}} przestała działać. Sprawdź, czy była
    aktualizacja albo zgłoszone prace; jeśli nie – ustal, kto był zalogowany
    w tym czasie (4624 w Mímirze), i przejrzyj zdarzenia z okresu, gdy usługa
    nie działała (bez Sysmona brakuje danych o procesach i połączeniach).
