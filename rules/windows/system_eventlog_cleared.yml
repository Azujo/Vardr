title: Wyczyszczono dziennik zdarzeń Windows (inny niż Security)
id: f4edfeeb-bfc1-43b9-91e1-1bbfe1c8a7a9
status: stable
description: |
  Wyczyszczono dziennik zdarzeń inny niż Security (np. System, PowerShell,
  Sysmon). Windows zapisuje wtedy zdarzenie 104 w dzienniku System. Atakujący
  czyszczą dzienniki, żeby usunąć ślady – dziennik Security obejmuje osobna
  reguła (1102).
author: Vardr
tags:
  - attack.defense_impairment
  - attack.t1685.005
logsource:
  product: windows
  service: system
detection:
  selection:
    EventID: 104
    Provider_Name: 'Microsoft-Windows-Eventlog'
  condition: selection
falsepositives:
  - Czyszczenie dzienników przez administratora albo narzędzia porządkujące
level: high
vardr:
  i18n:
    en:
      title: "Windows event log cleared (other than Security)"
      description: |
        An event log other than Security was cleared (e.g. System, PowerShell,
        Sysmon). Windows then writes event 104 to the System log. Attackers clear logs
        to remove traces – the Security log is covered by a separate rule (1102).
      instructions: |
        {{SubjectDomainName}}\{{SubjectUserName}} cleared a log on computer
        {{Computer}} (log name in the event fields). Find out whether it was planned;
        if not – review in Mímir the events from this computer from before clearing
        (Vardr has a copy) and treat the computer as suspicious.
  instructions: |
    {{SubjectDomainName}}\{{SubjectUserName}} wyczyścił dziennik na komputerze
    {{Computer}} (nazwa dziennika w polach zdarzenia). Ustal, czy było to
    planowane; jeśli nie – przejrzyj w Mímirze zdarzenia z tego komputera
    sprzed wyczyszczenia (Vardr ma ich kopię) i traktuj komputer jako
    podejrzany.
