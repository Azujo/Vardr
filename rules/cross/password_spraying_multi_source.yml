title: Password spraying z jednego adresu (wiele źródeł)
id: f3030bbb-4e11-4f15-b724-0f9f5dc59268
status: stable
description: |
  Nieudane logowania co najmniej 5 różnych osób z jednego adresu w ciągu
  10 minut – łącznie w AD, Entra ID, na VPN FortiGate i routerze MikroTik.
  Atakujący rozkłada próby jednego hasła na wiele kont i wiele usług, żeby
  nie przekroczyć progu w żadnej z osobna (np. 2 konta w AD, 2 w chmurze,
  1 na VPN). Osoba to konto bez domeny (panel → Tożsamości).
author: Vardr
tags:
  - attack.credential_access
  - attack.t1110.003
logsource: {}
detection:
  src_ad:
    event.dataset: windows.security
    EventID: [4625, 4771]
  src_entra:
    event.dataset: azure.signinlogs
    event.outcome: failure
  src_vpn:
    event.dataset: fortinet.fortigate
    event.action: ssl-login-fail
  src_router:
    event.dataset: mikrotik.routeros
    event.action: login
    event.outcome: failure
  no_address:
    source.ip: null
  condition: 1 of src_* and not no_address
falsepositives:
  - Wspólny adres NAT wielu użytkowników (biuro, VPN firmowy) i jednoczesna zmiana haseł
  - Skaner podatności albo test penetracyjny
level: high
vardr:
  i18n:
    en:
      title: "Password spraying from one address (many sources)"
      description: |
        Failed logons of at least 5 different people from one address within
        10 minutes – across AD, Entra ID, FortiGate VPN and MikroTik router combined.
        The attacker spreads attempts with one password over many accounts and services so
        as not to exceed the threshold in any of them (e.g. 2 accounts in AD, 2 in the cloud,
        1 on the VPN). A person is an account without the domain (panel → Identities).
      instructions: |
        From address {{source.ip}} in {{window}} there were failed logons of {{count}}
        different people: {{values}}. Check in the alert events which services were targeted
        (AD, Entra ID, VPN, router) – attempts in several services at once are a deliberate attack.
        Block the address on the firewall and in Entra ID (named location / Conditional
        Access), check whether any of these people later signed in from this address
        (rule "Successful logon after a series of failures"), and force a password change
        for accounts with weak passwords.
  group_by: [source.ip]
  threshold:
    count: 5
    distinct: user.identity
    window: 10m
  suppress: 1h
  instructions: |
    Z adresu {{source.ip}} w {{window}} były nieudane logowania {{count}} różnych
    osób: {{values}}. Sprawdź w zdarzeniach alertu, do jakich usług (AD, Entra
    ID, VPN, router) – próby w kilku usługach naraz to przemyślany atak.
    Zablokuj adres na zaporze i w Entra ID (named location / Conditional
    Access), sprawdź, czy któraś z tych osób zalogowała się potem z tego
    adresu (reguła „Udane logowanie po serii nieudanych”), i wymuś zmianę
    hasła kontom, które mają słabe hasła.
