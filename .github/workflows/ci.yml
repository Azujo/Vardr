# Testy przy każdym pushu i pull requeście (etap 1.5, ustalenie M1).
# Linux: serwer i części wspólne (z wykrywaniem wyścigów), Windows: agent.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  # Co tydzień (poniedziałek 5:00 UTC) – nowe podatności (govulncheck,
  # npm audit) pojawiają się także bez zmian w kodzie.
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux – serwer i testy wyścigów
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Prawdziwe bazy dla testów integracyjnych: zgodność silników detekcji
    # (ClickHouse) i magazyny w Sadze (PostgreSQL) – te same wersje co w laboratorium.
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:25.8
        env:
          CLICKHOUSE_PASSWORD: test
        ports: ["9000:9000"]
        options: >-
          --health-cmd "clickhouse-client --password test -q 'SELECT 1'"
          --health-interval 5s --health-timeout 5s --health-retries 30
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: t
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d t"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Formatowanie (gofmt)
        run: |
          out=$(gofmt -l agent server panel tools internal)
          if [ -n "$out" ]; then echo "Pliki wymagają gofmt:"; echo "$out"; exit 1; fi

      - name: go vet
        run: go vet ./...

      # Znane podatności w bibliotece standardowej i zależnościach – tylko te,
      # których kod faktycznie używa (wersja Go z toolchain w go.mod).
      - name: Znane podatności (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

      - name: Testy z wykrywaniem wyścigów
        run: go test -race -count=1 ./...

      # Po kolei (-p 1): testy dzielą jedną bazę PostgreSQL (osobne schematy).
      - name: Testy na prawdziwych bazach (zgodność silników detekcji, Saga)
        env:
          SIEM_TEST_CH_ADDR: 127.0.0.1:9000
          SIEM_TEST_CH_PASSWORD: test
          SIEM_TEST_PG_URL: postgres://postgres:test@127.0.0.1:5432/t?sslmode=disable
        run: go test -count=1 -p 1 -v -run 'Compat|Chain|Correlations|Postgres|PG' ./server/internal/detector ./internal/alerts ./internal/urd ./panel/internal/api/store

      - name: Fuzzing parsera XML zdarzeń (60 s)
        run: go test -run '^$' -fuzz FuzzParseWinEvent -fuzztime 60s ./server/internal/normalize

      # Wartości i nazwy pól z reguł (panel) nie zmieniają struktury SQL ClickHouse.
      - name: Fuzzing kompilatora reguł do SQL (60 s)
        run: go test -run '^$' -fuzz FuzzRuleSQL -fuzztime 60s ./internal/detect

      - name: Budowanie usług serwera
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p out
          for p in server/cmd/siem-ingest server/cmd/siem-normalizer server/cmd/siem-writer \
                   server/cmd/siem-loadgen server/cmd/siem-archiver server/cmd/siem-detector panel/cmd/siem-api tools/cmd/siem-pki; do
            go build -trimpath -ldflags="-s -w" -o out/ ./$p
          done
          ls -la out

  windows:
    name: Windows – agent
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: go vet
        run: go vet ./...

      # Kod agenta tylko dla Windows (usługa, Event Log) – osobna analiza.
      - name: Znane podatności (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

      - name: Testy
        run: go test -count=1 ./...

      - name: Budowanie agenta i czytnika eksportu archiwum
        run: |
          go build -trimpath -o vardr-agent.exe ./agent/cmd/vardr-agent
          go build -trimpath -o odczytaj.exe ./tools/cmd/odczytaj

  web:
    name: Frontend panelu (TypeScript + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: panel/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: panel/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      # Podatności paczek frontendu (wysokie i krytyczne przerywają CI).
      - name: Znane podatności (npm audit)
        run: npm audit --audit-level=high
      - run: npm run build
