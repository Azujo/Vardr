# Testy przy każdym pushu i pull requeście (etap 1.5, ustalenie M1).
# Linux: serwer i części wspólne (z wykrywaniem wyścigów), Windows: agent.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux – serwer i testy wyścigów
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Formatowanie (gofmt)
        run: |
          out=$(gofmt -l cmd internal)
          if [ -n "$out" ]; then echo "Pliki wymagają gofmt:"; echo "$out"; exit 1; fi

      - name: go vet
        run: go vet ./...

      - name: Testy z wykrywaniem wyścigów
        run: go test -race -count=1 ./...

      - name: Fuzzing parsera XML zdarzeń (60 s)
        run: go test -run '^$' -fuzz FuzzParseWinEvent -fuzztime 60s ./server/internal/normalize

      - name: Budowanie usług serwera
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p out
          for p in server/cmd/siem-ingest server/cmd/siem-normalizer server/cmd/siem-writer \
                   server/cmd/siem-loadgen panel/cmd/siem-api tools/cmd/siem-pki; do
            go build -trimpath -ldflags="-s -w" -o out/ ./$p
          done
          ls -la out

  windows:
    name: Windows – agent
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: go vet
        run: go vet ./...

      - name: Testy
        run: go test -count=1 ./...

      - name: Budowanie agenta
        run: go build -trimpath -o siem_agent.exe ./agent/cmd/siem_agent

  web:
    name: Frontend panelu (TypeScript + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: panel/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: panel/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
